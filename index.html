<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d0b36">
<meta property="og:title" content="UMA MENSAGEM ESPECIAL">
<meta property="og:description" content="Para minha sobrinha GABRIELY BERTOLIN ❤️">
<meta property="og:type" content="website">
<title>Cartão-surpresa da Gabriely</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Conceito: tela única e centrada. Cabeçalho, depois a caixa (que vira o cartão da mensagem) e a dica.
   Roxo profundo com halo lilás; o dourado aparece só nos detalhes e nos confetes. */
:root {
  --night: #1d0b36;
  --plum: #3a1678;
  --violet: #6d3bd8;
  --violet-deep: #4a1fa8;
  --violet-soft: #9b7cf2;
  --lilac: #d9c8ff;
  --mist: #f2ecff;
  --heart: #ff6fae;
  --gold: #ffd66b;
  --font-sans: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --s: clamp(170px, min(60vw, 42vh), 270px); /* tamanho da caixa */
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--mist);
  font-family: var(--font-sans);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

/* Fundo (fixo, sem background-attachment, que o Safari do iPhone não respeita) */
.bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  background:
    radial-gradient(60% 45% at 50% 44%, rgba(190, 160, 255, .34), rgba(190, 160, 255, 0) 70%),
    radial-gradient(90% 60% at 50% 112%, rgba(109, 59, 216, .6), rgba(109, 59, 216, 0) 70%),
    linear-gradient(180deg, #1d0b36 0%, #3a1678 58%, #4a1f96 100%);
}
.sparks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.spark {
  position: absolute; border-radius: 50%; opacity: .15;
  animation: twinkle 3.6s ease-in-out infinite;
}

.page {
  position: relative; z-index: 1;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: 28px;
  padding-inline: 16px;
  overflow: hidden;
}
.wrap {
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
.wrap > * + * { margin-top: clamp(22px, 4.5vh, 40px); }

/* ---------- Cabeçalho ---------- */
.eyebrow {
  margin: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: clamp(10.5px, 3.2vw, 13px);
  line-height: 1;
  letter-spacing: .26em;
  color: var(--lilac);
}
.eyebrow::before, .eyebrow::after {
  content: ""; display: block; height: 1px; width: clamp(16px, 8vw, 40px);
}
.eyebrow::before { margin-right: 12px; background: linear-gradient(90deg, rgba(155,124,242,0), var(--violet-soft)); }
.eyebrow::after  { margin-left: 8px;  background: linear-gradient(270deg, rgba(155,124,242,0), var(--violet-soft)); }

.para {
  margin: 14px 0 0;
  font-family: var(--font-serif);
  font-style: italic; font-weight: 400;
  font-size: clamp(18px, 5vw, 22px);
  line-height: 1.35;
  color: var(--mist);
}
.name {
  display: block; margin-top: 8px;
  font-family: var(--font-serif);
  font-style: normal; font-weight: 700;
  font-size: clamp(27px, 8.2vw, 44px);
  line-height: 1.14;
  letter-spacing: .05em;
  color: #fff;
  text-shadow: 0 0 28px rgba(155, 124, 242, .9), 0 2px 0 rgba(30, 10, 70, .5);
}
.nm { display: inline-block; white-space: nowrap; }

/* ---------- Palco: caixa e cartão dividem o mesmo lugar ---------- */
.stage {
  position: relative;
  display: grid; place-items: center;
  width: 100%; min-height: var(--s);
}
.stage > * { grid-area: 1 / 1; }

.halo {
  width: calc(var(--s) * 1.5); height: calc(var(--s) * 1.5);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(205, 180, 255, .55) 0%, rgba(155, 124, 242, .22) 45%, rgba(155, 124, 242, 0) 70%);
  animation: breathe 4s ease-in-out infinite;
  pointer-events: none;
}

/* ---------- Caixa de presente ---------- */
.gift {
  position: relative;
  display: block;
  width: var(--s); height: var(--s);
  margin: 0; padding: 0; border: 0;
  background: none;
  -webkit-appearance: none; appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  transform-origin: 50% 90%;
  animation: bob 4.2s ease-in-out infinite;
  transition: opacity .35s ease;
}
.gift:disabled { cursor: default; }
.gift:focus-visible { outline: 3px solid var(--lilac); outline-offset: 10px; border-radius: 24px; }
.gift > span { position: absolute; display: block; }

.gift .shadow {
  left: 8%; bottom: -1%; width: 84%; height: 9%;
  background: radial-gradient(closest-side, rgba(10, 0, 30, .6), rgba(10, 0, 30, 0));
}
.gift .base {
  left: 9%; bottom: 4%; width: 82%; height: 52%;
  border-radius: calc(var(--s) * .04);
  background:
    linear-gradient(90deg, rgba(0,0,0,.24), rgba(255,255,255,.07) 30%, rgba(0,0,0,0) 62%, rgba(0,0,0,.22)),
    linear-gradient(180deg, #7a47e6, #4f20b4);
  box-shadow: 0 calc(var(--s) * .03) calc(var(--s) * .06) rgba(10, 0, 40, .35);
  transition: transform .7s ease, opacity .6s ease;
}
.gift .base::before {
  content: ""; position: absolute; left: 0; top: 0; right: 0; height: 16%;
  border-radius: calc(var(--s) * .04) calc(var(--s) * .04) 0 0;
  background: linear-gradient(180deg, rgba(20, 0, 60, .38), rgba(20, 0, 60, 0));
}
.gift .base::after, .gift .lid::after {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 17%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, #e2caff, #fcf3ff 46%, #cfaeff);
}
.gift .lid {
  left: 3%; bottom: 54%; width: 94%; height: 21%;
  border-radius: calc(var(--s) * .05);
  background:
    linear-gradient(90deg, rgba(0,0,0,.2), rgba(255,255,255,.1) 30%, rgba(0,0,0,0) 62%, rgba(0,0,0,.18)),
    linear-gradient(180deg, #9068f0, #6a35d2);
  box-shadow: 0 calc(var(--s) * .015) calc(var(--s) * .035) rgba(20, 0, 60, .4);
  transition: transform .85s cubic-bezier(.3, .7, .3, 1), opacity .6s ease .15s;
}
.gift .lid::after { border-radius: 0; }

/* Laço */
.gift .bow { position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; z-index: 2; }
.gift .loop {
  position: absolute; bottom: calc(var(--s) * -.015);
  width: calc(var(--s) * .2); height: calc(var(--s) * .15);
  border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
  background: linear-gradient(135deg, #fcf3ff, #d6b3ff);
  box-shadow: 0 2px 5px rgba(30, 0, 80, .3);
}
.gift .loop::after {
  content: ""; position: absolute; left: 20%; right: 20%; top: 24%; bottom: 20%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #7c4de0, #5324b8);
}
.gift .loop.l { right: calc(var(--s) * -.015); transform-origin: 100% 100%; transform: rotate(-24deg); }
.gift .loop.r { left:  calc(var(--s) * -.015); transform-origin: 0 100%;   transform: rotate(24deg); }
.gift .knot {
  position: absolute; left: calc(var(--s) * -.047); bottom: calc(var(--s) * -.03);
  width: calc(var(--s) * .094); height: calc(var(--s) * .09);
  border-radius: 36%;
  background: linear-gradient(180deg, #fff4ff, #c9a2ff);
  box-shadow: 0 2px 4px rgba(40, 0, 90, .35);
  z-index: 3;
}
.gift .glow {
  left: -20%; top: -20%; width: 140%; height: 140%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 246, 205, .96) 0%, rgba(217, 200, 255, .7) 28%, rgba(155, 124, 242, 0) 62%);
  opacity: 0; pointer-events: none; z-index: 4;
}

/* Estados da caixa */
.is-shaking .gift { animation: shake .62s ease both; }
.is-open .gift { animation: none; opacity: 0; pointer-events: none; transition: opacity .5s ease .75s; }
.is-open .gift .lid { transform: translate(20%, -200%) rotate(30deg); opacity: 0; }
.is-open .gift .base { transform: translateY(8%) scale(.9); opacity: 0; transition: transform .7s ease .35s, opacity .6s ease .45s; }
.is-open .gift .glow { animation: flash 1.1s ease-out both; }

/* ---------- Cartão da mensagem ---------- */
.card {
  position: relative;
  width: min(100%, 420px);
  padding: 30px 22px 28px;
  border-radius: 28px;
  background: linear-gradient(180deg, #fcf9ff, #ece2ff);
  color: var(--night);
  text-align: center;
  box-shadow: 0 26px 60px rgba(10, 0, 40, .55), inset 0 0 0 1px rgba(255, 255, 255, .75);
  opacity: 0;
  transform: translateY(32px) scale(.88);
  transition: opacity .5s ease, transform .75s cubic-bezier(.2, 1.35, .4, 1);
  outline: none;
}
.card.show { opacity: 1; transform: none; }
.card::before {
  content: ""; position: absolute; left: 50%; top: 0;
  width: 48px; height: 6px; transform: translateX(-50%);
  border-radius: 0 0 6px 6px; background: var(--violet-soft);
}
.card p { margin: 0; }
.card .l1 {
  font-family: var(--font-serif); font-weight: 700;
  font-size: clamp(24px, 7vw, 32px); line-height: 1.22;
  text-wrap: balance;
}
.amount {
  display: inline-block; white-space: nowrap;
  padding: 0 .16em;
  color: var(--violet-deep);
  background: linear-gradient(transparent 62%, rgba(255, 214, 107, .8) 62%);
}
.card.show .amount { animation: pop .75s cubic-bezier(.2, 1.6, .4, 1) .35s both; }
.card .l2 {
  margin-top: 16px;
  font-family: var(--font-sans); font-weight: 600;
  font-size: clamp(16px, 4.6vw, 19px); line-height: 1.5;
  color: #4b2b8f;
}
.card .l2 strong { color: #5a2fc0; font-weight: 800; }

/* ---------- Dica e botão ---------- */
.hint {
  margin: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 15px; line-height: 1.2; letter-spacing: .05em;
  color: var(--lilac);
}
.hint .dot {
  display: block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%;
  background: var(--gold);
  animation: ping 1.7s ease-out infinite;
}
.replay {
  min-height: 44px; padding: 12px 24px;
  font-family: var(--font-sans); font-weight: 700; font-size: 15px; letter-spacing: .03em;
  color: var(--mist);
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 999px;
  -webkit-appearance: none; appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  transition: background .2s ease, transform .15s ease;
}
.replay:hover { background: rgba(255, 255, 255, .2); }
.replay:active { transform: scale(.97); }
.replay:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }

#confetti {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 5;
}

/* ---------- Animações ---------- */
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0); }
  45% { transform: translateY(-9px) rotate(0); }
  62% { transform: translateY(-9px) rotate(-2.5deg); }
  68% { transform: translateY(-9px) rotate(2.5deg); }
  74% { transform: translateY(-9px) rotate(-2deg); }
  80% { transform: translateY(-9px) rotate(0); }
}
@keyframes shake {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  10% { transform: translate(-5px, 0) rotate(-5deg); }
  20% { transform: translate(6px, -3px) rotate(5deg); }
  30% { transform: translate(-6px, 0) rotate(-6deg); }
  40% { transform: translate(6px, -4px) rotate(6deg); }
  50% { transform: translate(-7px, 0) rotate(-7deg); }
  60% { transform: translate(7px, -4px) rotate(7deg); }
  75% { transform: translate(-4px, 0) rotate(-4deg) scale(1.04); }
  90% { transform: translate(2px, 0) rotate(2deg) scale(1.06); }
}
@keyframes flash {
  0% { opacity: 0; transform: scale(.2); }
  25% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.9); }
}
@keyframes breathe {
  0%, 100% { transform: scale(.94); opacity: .85; }
  50% { transform: scale(1.04); opacity: 1; }
}
@keyframes twinkle {
  0%, 100% { opacity: .12; transform: scale(.6); }
  50% { opacity: .95; transform: scale(1.15); }
}
@keyframes ping {
  0% { box-shadow: 0 0 0 0 rgba(255, 214, 107, .75); }
  80%, 100% { box-shadow: 0 0 0 12px rgba(255, 214, 107, 0); }
}
@keyframes pop {
  0% { transform: scale(.6); }
  100% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .gift, .halo, .spark, .hint .dot { animation: none !important; }
  .spark { opacity: .5; }
  .card { transition: opacity .3s ease; transform: none; }
  .card.show .amount { animation: none; }
  .gift .lid, .gift .base { transition-duration: .2s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<!-- Estrelinhas e confetes ficam por cima do fundo -->
<div class="bg" aria-hidden="true"></div>
<div class="sparks" id="sparks" aria-hidden="true"></div>

<main class="page" id="page">
  <div class="wrap">

    <!-- EDITE AQUI: frase de abertura e nome -->
    <header class="head">
      <p class="eyebrow">UMA MENSAGEM ESPECIAL</p>
      <p class="para">Para minha sobrinha <span class="name"><span class="nm">GABRIELY</span> <span class="nm">BERTOLIN ❤️</span></span></p>
    </header>

    <section class="stage" aria-label="Presente surpresa">
      <div class="halo" aria-hidden="true"></div>

      <button type="button" class="gift" id="gift" aria-label="Abrir o presente surpresa">
        <span class="shadow"></span>
        <span class="base"></span>
        <span class="lid"><span class="bow"><i class="loop l"></i><i class="loop r"></i><i class="knot"></i></span></span>
        <span class="glow"></span>
      </button>

      <!-- EDITE AQUI: mensagem revelada -->
      <div class="card" id="card" role="status" tabindex="-1" hidden>
        <p class="l1">Você ganhou <span class="amount">R$ 150,00</span> de presente!</p>
        <p class="l2">Me manda seu <strong>PIX</strong> para eu te enviar o presente. ❤️</p>
      </div>
    </section>

    <p class="hint" id="hint"><span class="dot"></span>Toque na caixa para abrir</p>
    <button type="button" class="replay" id="replay" hidden>Ver de novo</button>

  </div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';

  var page = document.getElementById('page');
  var gift = document.getElementById('gift');
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var replay = document.getElementById('replay');
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function rand(a, b) { return a + Math.random() * (b - a); }

  /* ---------- Estrelinhas do fundo ---------- */
  var sparks = document.getElementById('sparks');
  for (var i = 0; i < 26; i++) {
    var s = document.createElement('i');
    var z = rand(2, 5);
    s.className = 'spark';
    s.style.left = rand(2, 98) + '%';
    s.style.top = rand(2, 98) + '%';
    s.style.width = z + 'px';
    s.style.height = z + 'px';
    s.style.animationDuration = rand(2.8, 5.2) + 's';
    s.style.animationDelay = rand(0, 4) + 's';
    s.style.background = (i % 5 === 0) ? '#ffd66b' : '#e5d8ff';
    sparks.appendChild(s);
  }

  /* ---------- Confetes (canvas) ---------- */
  var COLORS = ['#9b7cf2', '#d9c8ff', '#ffffff', '#ff6fae', '#ffd66b', '#6d3bd8', '#c9a8ff'];
  var parts = [], raf = 0, rainUntil = 0, W = 0, H = 0;

  function size() {
    var r = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener('resize', size);

  function make(x, y, vx, vy) {
    var shape = Math.random() < 0.16 ? 2 : (Math.random() < 0.3 ? 1 : 0);
    return {
      x: x, y: y, vx: vx, vy: vy,
      w: rand(6, 11), h: rand(9, 16),
      rot: rand(0, 6.28), vr: rand(-0.25, 0.25),
      wob: rand(0, 6.28), wv: rand(0.08, 0.2),
      c: shape === 2 ? '#ff6fae' : COLORS[(Math.random() * COLORS.length) | 0],
      shape: shape
    };
  }

  function heart(sz) {
    ctx.beginPath();
    ctx.moveTo(0, sz * 0.35);
    ctx.bezierCurveTo(-sz * 0.9, -sz * 0.3, -sz * 0.45, -sz * 0.85, 0, -sz * 0.35);
    ctx.bezierCurveTo(sz * 0.45, -sz * 0.85, sz * 0.9, -sz * 0.3, 0, sz * 0.35);
    ctx.fill();
  }

  function step(t) {
    ctx.clearRect(0, 0, W, H);
    if (t < rainUntil && parts.length < 260) {
      for (var k = 0; k < 2; k++) {
        if (Math.random() < 0.6) parts.push(make(rand(0, W), -14, rand(-1, 1), rand(2, 4)));
      }
    }
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vx *= 0.985;
      p.vy += 0.28;
      p.vy *= 0.992;
      if (p.vy > 6.5) p.vy = 6.5;
      p.wob += p.wv;
      p.x += p.vx + Math.sin(p.wob) * 0.7;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 24) { parts.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.shape === 1) {
        ctx.beginPath(); ctx.arc(0, 0, p.w * 0.35, 0, 6.283); ctx.fill();
      } else if (p.shape === 2) {
        heart(p.w * 0.9);
      } else {
        var f = Math.abs(Math.cos(p.wob)) * 0.9 + 0.1;
        ctx.fillRect(-p.w / 2, -p.h / 2 * f, p.w, p.h * f);
      }
      ctx.restore();
    }
    if (parts.length || t < rainUntil) {
      raf = requestAnimationFrame(step);
    } else {
      raf = 0;
      ctx.clearRect(0, 0, W, H);
    }
  }
  function start() { if (!raf) raf = requestAnimationFrame(step); }

  function burst(n) {
    var r = gift.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height * 0.45;
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + rand(-1.25, 1.25);
      var sp = rand(6, 14);
      parts.push(make(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp));
    }
    start();
  }
  function rain(ms) { rainUntil = performance.now() + ms; start(); }

  /* ---------- Abrir o presente ---------- */
  var state = 'closed', timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); timers = []; }

  function showCard() {
    card.hidden = false;
    void card.offsetWidth;          // força o navegador a registrar o estado inicial
    card.classList.add('show');
    hint.hidden = true;
    replay.hidden = false;
    state = 'open';
    try { card.focus({ preventScroll: true }); } catch (e) {}
  }

  function open() {
    if (state !== 'closed') return;
    state = 'busy';
    gift.disabled = true;
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
    if (!reduce) page.classList.add('is-shaking');
    later(function () {
      page.classList.remove('is-shaking');
      page.classList.add('is-open');
      burst(reduce ? 36 : 130);
      if (!reduce) { rain(2600); later(function () { burst(70); }, 450); }
      later(showCard, reduce ? 0 : 350);
    }, reduce ? 0 : 620);
  }

  function reset() {
    clearTimers();
    parts = []; rainUntil = 0;
    page.classList.remove('is-open', 'is-shaking');
    card.classList.remove('show');
    card.hidden = true;
    replay.hidden = true;
    hint.hidden = false;
    gift.disabled = false;
    state = 'closed';
  }

  gift.addEventListener('click', open);
  replay.addEventListener('click', reset);
})();
</script>
</body>
</html>
